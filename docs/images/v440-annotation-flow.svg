<text x="96" y="430" font-size="23" font-weight="600">完整性与用户数据保护</text><text x="96" y="474" font-size="20">批注与同步比较一起提交；取消、失败或库版本变化 → 保留上次快照和本地修改。</text><text x="96" y="515" font-size="20">超过条数或字节预算会明确提示；未完整读取时，不推断缺席批注已经删除。</text><text x="96" y="556" font-size="20">SQLite schema 21 仅迁移 ResearchClip 缓存；不写 Zotero 数据库或原 PDF。</text><text x="96" y="595" font-size="18" fill="#5f6368">独立测试配置验证通过前，不把模拟接口结果当作真实插件安装、配对或写入成功。</text></g></svg>
