<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-label="应用内浏览器导航与资料会话保留示意">
<rect width="1100" height="600" rx="24" fill="#f1f5fc"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#183153">
<text x="36" y="49" font-size="25" font-weight="700">应用内科研浏览器 · 操作示意（非运行截图）</text>
<rect x="30" y="78" width="1040" height="370" rx="20" fill="white" stroke="#c5d2e6" stroke-width="2"/>
<rect x="44" y="94" width="125" height="336" rx="12" fill="#e8f0fe"/><text x="60" y="126" font-size="17">ResearchClip</text><text x="60" y="168" font-size="15">素材与项目</text><text x="60" y="207" font-size="15">笔记与指南</text>
<rect x="181" y="94" width="829" height="38" rx="12" fill="#eaf1fc"/><text x="198" y="119" font-size="16">资料工作台：网页</text><text x="504" y="119" font-size="16">PDF / Markdown 标签与草稿保留</text>
<rect x="181" y="140" width="829" height="53" rx="14" fill="#f2f5fa"/><text x="193" y="172" font-size="23">←  →  ↻  ⌂</text><rect x="332" y="150" width="484" height="33" rx="16" fill="white" stroke="#4285f4"/><text x="346" y="173" font-size="17">https://www.google.com/ 或输入搜索词</text><text x="831" y="173" font-size="16">前往　100%　↗</text>
<rect x="181" y="203" width="829" height="227" rx="12" fill="#fff" stroke="#d6dfed"/><text x="415" y="294" font-size="39" font-weight="600" fill="#4285f4">独立 WebView2 网页区</text><text x="390" y="333" font-size="18">访问公开网页；不授予研究资料和数据库权限</text>
<circle cx="1040" cy="118" r="21" fill="#4285f4"/><text x="1029" y="127" font-size="25" fill="white">G</text><text x="1028" y="169" font-size="26">↩</text>
<circle cx="1040" cy="226" r="16" fill="#34a853"/><text x="1034" y="232" font-size="17" fill="white">1</text><circle cx="571" cy="219" r="16" fill="#ea4335"/><text x="565" y="225" font-size="17" fill="white">2</text><circle cx="938" cy="396" r="16" fill="#d99400"/><text x="932" y="402" font-size="17" fill="white">3</text>
<text x="38" y="490" font-size="19">1　点最右侧 G 切换；↩ 返回资料工作台，不关闭笔记。</text><text x="38" y="531" font-size="19">2　地址栏输入网址或关键词，前往；后退 / 前进 / 刷新或停止。</text><text x="38" y="572" font-size="19">3　拖动分栏调整空间；网页缩放50%–200%，外部Chrome处理登录和下载。</text></g></svg>
