<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="550" viewBox="0 0 1500 550"><rect width="1500" height="550" rx="24" fill="#f8fafd"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#203047"><text x="52" y="60" font-size="28" font-weight="700">ResearchClip 专用 Zotero Connector</text><text x="52" y="96" font-size="18">流程示意 · 非窗口截图 · 需要用户手动启用与配对</text><g stroke="#a8bde0" stroke-width="2"><rect x="50" y="145" width="325" height="178" rx="22" fill="#e8f0fe"/><rect x="425" y="145" width="290" height="178" rx="22" fill="#e6f4ea"/><rect x="765" y="145" width="300" height="178" rx="22" fill="#fff4d5"/><rect x="1115" y="145" width="335" height="178" rx="22" fill="#fce8e6"/></g><g font-size="23" font-weight="650"><text x="77" y="189">Zotero 内部插件</text><text x="450" y="189">认证本机回环</text><text x="790" y="189">来源与原件核对</text><text x="1140" y="189">现有 ResearchClip</text></g><g font-size="18"><text x="77" y="228">用户选择文献或 PDF</text><text x="77" y="260">library / item / attachment</text><text x="77" y="292">指定页码或批注 key</text><text x="450" y="228">120 秒一次配对码</text><text x="450" y="260">内存会话 · 有界请求</text><text x="450" y="292">拒绝网页来源与重放</text><text x="790" y="228">Local API 实例身份</text><text x="790" y="260">附件与已授权文件</text><text x="790" y="292">内容哈希与实际页码</text><text x="1140" y="228">复用 PDF 独立标签</text><text x="1140" y="260">保留 Markdown 编辑状态</text><text x="1140" y="292">用户确认后保存关联</text></g><g stroke="#4285f4" fill="#4285f4" stroke-width="4"><path d="M384 233h30m-9-9 9 9-9 9M724 233h30m-9-9 9 9-9 9M1074 233h30m-9-9 9 9-9 9"/><path d="M1280 347v42H206v-42" fill="none"/><path d="m197 359 9-12 9 12"/></g><text x="454" y="424" font-size="20">反向定位须完整来源校验；插件确认后才标记完成</text><text x="52" y="479" font-size="19">变化提示 → 既有批注同步适配器只读比较 → 冲突与本地修改保留 → 用户主动提交</text><text x="52" y="516" font-size="17" fill="#586c86">不直接写 Zotero SQLite，不修改原 PDF，不把私有手写或 Markdown 自动写入 Zotero。</text></g></svg>
