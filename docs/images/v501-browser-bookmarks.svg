<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-label="左侧浏览器和本地网页书签操作示意">
<rect width="1100" height="620" rx="24" fill="#f2f6ff"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203552"><text x="32" y="48" font-size="25" font-weight="700">左侧浏览器 · 保存与管理网页（操作示意，非运行截图）</text>
<rect x="28" y="76" width="1044" height="390" rx="18" fill="white" stroke="#cbd6e8"/>
<rect x="42" y="92" width="182" height="357" rx="12" fill="#edf3fc"/><text x="60" y="126" font-size="19">ResearchClip</text><text x="60" y="171" font-size="17">截图素材</text><rect x="51" y="188" width="164" height="42" rx="18" fill="#4285f4"/><text x="63" y="215" font-size="17" fill="white">◎ Google浏览器</text><text x="60" y="268" font-size="17">收藏 / 标签 / 设置</text><text x="60" y="421" font-size="17">使用指南</text>
<rect x="239" y="92" width="815" height="43" rx="12" fill="#edf3fc"/><text x="254" y="119" font-size="18">←　→　↻　⌂　 https://example.com/　前往　100%　↗</text>
<rect x="239" y="142" width="815" height="42" rx="10" fill="#f7f9fc" stroke="#dce5f1"/><text x="252" y="170" font-size="21" fill="#d79300">☆</text><rect x="291" y="151" width="113" height="25" rx="12" fill="#e8f0fe"/><text x="306" y="169" font-size="15">论文检索</text><rect x="416" y="151" width="113" height="25" rx="12" fill="#e9f5ed"/><text x="431" y="169" font-size="15">常用期刊</text><text x="937" y="169" font-size="16">管理快捷方式</text>
<rect x="368" y="203" width="554" height="235" rx="18" fill="white" stroke="#4285f4" stroke-width="2"/><text x="390" y="237" font-size="20" font-weight="700">保存网页快捷方式</text><text x="390" y="277" font-size="16">名称</text><rect x="454" y="253" width="438" height="35" rx="9" fill="#f1f5fb"/><text x="468" y="277" font-size="17">论文检索</text><text x="390" y="324" font-size="16">网址</text><rect x="454" y="301" width="438" height="35" rx="9" fill="#f1f5fb"/><text x="468" y="325" font-size="17">https://example.com/</text><text x="390" y="365" font-size="15">仅保存在本机；支持编辑、排序及确认移除。</text><rect x="751" y="383" width="140" height="35" rx="17" fill="#4285f4"/><text x="785" y="406" font-size="16" fill="white">保存书签</text>
<text x="36" y="510" font-size="20">1　左侧Google浏览器切换工作台，PDF / Markdown标签继续保留。</text><text x="36" y="551" font-size="20">2　星形按钮保存当前网页；书签栏一键打开，不自动访问全部网址。</text><text x="36" y="592" font-size="20">3　管理页编辑、上移/下移、确认移除；重启后保留，Chrome同步另行管理。</text></g></svg>
