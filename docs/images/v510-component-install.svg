<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390"><rect width="1040" height="390" rx="24" fill="#edf2fa"/><g font-family="Microsoft YaHei, sans-serif" fill="#203047"><text x="38" y="54" font-size="25" font-weight="bold">模型与扩展：下载、校验、使用</text><text x="38" y="88" font-size="16">流程示意 · 文件下载完成与目标软件安装成功分别显示</text></g><g fill="#fff" stroke="#c8d5e7"><rect x="36" y="118" width="224" height="200" rx="18"/><rect x="280" y="118" width="224" height="200" rx="18"/><rect x="524" y="118" width="224" height="200" rx="18"/><rect x="768" y="118" width="236" height="200" rx="18"/></g><g font-family="Microsoft YaHei, sans-serif" fill="#203047" font-size="17"><text x="58" y="158" fill="#1967d2">1 选择与确认</text><text x="58" y="198">分类 / 搜索 → 组件卡片</text><text x="58" y="234">核对来源、许可和兼容性</text><text x="58" y="270">明确确认后开始下载</text><text x="302" y="158" fill="#188038">2 下载与核验</text><text x="302" y="198">进度可见，可取消重试</text><text x="302" y="234">大小 + SHA-256 校验</text><text x="302" y="270">失败保留原有版本</text><text x="546" y="158" fill="#b06000">3 真实就绪</text><text x="546" y="198">模型：CPU 自检通过</text><text x="546" y="234">插件：导出安装文件</text><text x="546" y="270">按 Zotero / 浏览器安装</text><text x="790" y="158" fill="#a142f4">4 配置与使用</text><text x="790" y="198">点击“配置与安装引导”</text><text x="790" y="234">定位实际模块并检查状态</text><text x="790" y="270">主动识别 / 索引 / 连接</text><text x="38" y="357" font-size="15">文件不等于可用：模型必须真实推理；插件必须在目标软件安装并完成连接。</text></g></svg>